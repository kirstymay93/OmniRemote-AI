name: OmniRemote AI CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Basic validation (app startup check)
        run: node index.js &
      
      - name: Wait for server boot
        run: sleep 3

      - name: Kill test server
        run: pkill node || true