name: OmniRemote AI CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show folders
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build || echo "No build script found"

      - name: Run test
        run: npm test || echo "No tests configured"